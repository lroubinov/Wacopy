services:
  maaviron:
    image: maaviron:4.0.1
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maaviron-v401
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOSTNAME: "0.0.0.0"
      FORCE_SECURE_COOKIE: "true"
      WACOPY_DB_PATH: "/data/wacopy.db"
    volumes:
      - wacopy_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/text').then(r=>{if(r.status!==200&&r.status!==401)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  wacopy_data:
    name: ${WACOPY_VOLUME_NAME:-maaviron300_wacopy_data}
